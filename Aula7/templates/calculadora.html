<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <h1>Calculadora</h1>

    <div id="calculator">

        <form method="POST" action="{{ url_for('index') }}">

            <div class="form-grupo">
                <label for="num1">Primeiro número</label>

                <input
                    type="number"
                    id="num1"
                    name="num1"
                    step="any"
                    required
                    value="{{ request.form.get('num1', '') }}"
                >
            </div>

            {% set op = request.form.get('operacao', '+') %}

            <div class="form-grupo">
                <label for="operacao">Operação</label>

                <select
                    id="operacao"
                    name="operacao"
                    required
                    onchange="atualizarCampos()"
                >
                    <option value="+" {% if op == '+' %}selected{% endif %}>+ Somar</option>

                    <option value="-" {% if op == '-' %}selected{% endif %}>- Subtrair</option>

                    <option value="*" {% if op == '*' %}selected{% endif %}>* Multiplicar</option>

                    <option value="/" {% if op == '/' %}selected{% endif %}>/ Dividir</option>

                    <option value="**" {% if op == '**' %}selected{% endif %}>^ Potência</option>

                    <option value="sqrt" {% if op == 'sqrt' %}selected{% endif %}>√ Raiz quadrada</option>

                    <option value="bhaskara" {% if op == 'bhaskara' %}selected{% endif %}>Bhaskara</option>
                </select>
            </div>

            <div class="form-grupo" id="grupo-num2">
                <label for="num2">Segundo número</label>

                <input
                    type="number"
                    id="num2"
                    name="num2"
                    step="any"
                    value="{{ request.form.get('num2', '') }}"
                >
            </div>

            <div id="grupo-bhaskara">

                <div class="form-grupo">
                    <label for="a">A</label>

                    <input
                        type="number"
                        step="any"
                        id="a"
                        name="a"
                    >
                </div>

                <div class="form-grupo">
                    <label for="b">B</label>

                    <input
                        type="number"
                        step="any"
                        id="b"
                        name="b"
                    >
                </div>

                <div class="form-grupo">
                    <label for="c">C</label>

                    <input
                        type="number"
                        step="any"
                        id="c"
                        name="c"
                    >
                </div>

            </div>

            <button type="submit">Calcular</button>

        </form>

        {% if etapas %}

        <div class="resultado">

            <div>{{ etapas|safe }}</div>

            <div>
                Resultado: {{ resultados }}
            </div>

        </div>

        {% endif %}

        <a href="{{ url_for('index') }}">
            Limpar
        </a>

    </div>

    <script>

        function atualizarCampos() {

            const operacao =
                document.getElementById("operacao").value;

            const raiz =
                operacao === "sqrt";

            const bhaskara =
                operacao === "bhaskara";

            const grupoNum2 =
                document.getElementById("grupo-num2");

            const grupoBhaskara =
                document.getElementById("grupo-bhaskara");

            grupoNum2.style.display =
                (raiz || bhaskara)
                ? "none"
                : "block";

            grupoBhaskara.style.display =
                bhaskara
                ? "block"
                : "none";
        }

        atualizarCampos();

    </script>

</body>
</html>
