<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>{% block title %}Flask Menu{% endblock %}</title>
</head>

<body>
    <div class="menu">
        <nav>
            <ul>
                <li><a href="{{ url_for('home') }}">Sobre Mim</a></li>
                <li><a href="{{ url_for('page1') }}">Projetos para o futuro</a></li>
                <li><a href="{{ url_for('page2') }}">O que você gosta de fazer</a></li>
            </ul>
        </nav>
    </div>

    <div class="content">
        {% block content %}
        <!-- O conteúdo das páginas filhas será inserido aqui -->
        {% endblock %}
    </div>

</body>

</html>
